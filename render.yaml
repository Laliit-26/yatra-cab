# Render Blueprint — two Node web services (the customer/driver API and the
# hardened admin API). MongoDB is external (use MongoDB Atlas free tier).
#
# Deploy: Render Dashboard → New → Blueprint → connect this repo. Then fill the
# `sync: false` secrets in each service's Environment tab (see DEPLOYMENT.md).
services:
  # ── Customer + Driver API (REST + Socket.io) ──────────────────────────────
  - type: web
    name: yatracab-server-app
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm run start --workspace server-app
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PAYMENT_PROVIDER
        value: mock
      # DEMO_OTP must NOT be set in production — it bypasses OTP verification.
      # Use a real SMTP (GMAIL_USER + GMAIL_APP_PASSWORD) or a paid OTP provider.
      # SECURITY: AUTO_SEED creates demo accounts (including an ops admin whose
      # OTP is the fixed demo code) on first boot. Default it off — seed a fresh
      # database deliberately instead:
      #   MONGODB_URI="<atlas uri>" SEED_DEMO_EMAIL="you@example.com" npm run seed
      # Pass a real SEED_DEMO_EMAIL or the admin lands on admin@yatracab.test and
      # can never receive an OTP.
      - key: AUTO_SEED
        value: "false"
      - key: MONGODB_URI          # mongodb+srv://... (Atlas)
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: APP_CLIENT_URLS      # customer + driver Netlify sites (public URLs, not secret)
        value: https://yatracab-rider.netlify.app,https://yatracab-driver.netlify.app
      - key: GMAIL_USER           # optional — for real OTP emails
        sync: false
      - key: GMAIL_APP_PASSWORD   # optional
        sync: false

  # ── Admin / Ops API (independent, hardened) ───────────────────────────────
  - type: web
    name: yatracab-server-admin
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm run start --workspace server-admin
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # DEMO_OTP must NOT be set in production — it bypasses OTP verification.
      - key: MONGODB_URI          # SAME Atlas URI as server-app (shared database)
        sync: false
      - key: JWT_ACCESS_SECRET    # can be independent — admin tokens are separate
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ADMIN_CLIENT_URLS    # admin Netlify site (public URL, not secret)
        value: https://yatracab-ops.netlify.app
